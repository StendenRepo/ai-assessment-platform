# Temporary override: use native Ollama on your Mac instead of the Docker container.
#
# 1. Run: ./scripts/use-host-ollama.sh
# 2. Revert: ./scripts/use-docker-ollama.sh
#
# This file only documents the host URL; the script stops the Docker ollama
# container so port 11434 is free for native Ollama (Metal GPU on Mac).

services:
    backend:
        environment:
            OLLAMA_BASE_URL: http://host.docker.internal:11434

    retention-worker:
        environment:
            OLLAMA_BASE_URL: http://host.docker.internal:11434
