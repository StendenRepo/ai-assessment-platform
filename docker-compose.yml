services:
    frontend:
        build:
            context: ./frontend
        container_name: frontend
        ports:
            - '3000:3000'
        restart: unless-stopped
    backend:
        build:
            context: ./backend
        container_name: backend
        ports:
            - '8000:8000'
        environment:
            DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/ai_assessment}
            UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
            RECORDING_DIR: ${RECORDING_DIR:-/app/data/recordings}
            EXPORT_DIR: ${EXPORT_DIR:-/app/data/exports}
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped
    postgres:
        image: postgres:16-alpine
        container_name: postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-ai_assessment}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_assessment}']
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

volumes:
    postgres_data:
