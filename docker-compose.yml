services:
    frontend:
        build:
            context: ./frontend
        container_name: frontend
        ports:
            - '3000:3000'
        volumes:
            - ./frontend:/app
            - /app/node_modules
        environment:
            - CHOKIDAR_USEPOLLING=true
    backend:
        build:
            context: ./backend
        container_name: backend
        ports:
            - '8000:8000'
        env_file:
            - ./backend/.env
        restart: unless-stopped
