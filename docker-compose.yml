name: ai-assessment

services:
    frontend:
        build:
            context: ./frontend
            target: production
        container_name: frontend
        ports:
            - '3000:3000'
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://localhost:3000 || exit 1']
            interval: 30s
            timeout: 10s
            retries: 3
        restart: unless-stopped
    backend:
        build:
            context: ./backend
            target: production
        container_name: backend
        ports:
            - '8000:8000'
        environment:
            DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/ai_assessment}
            UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
            RECORDING_DIR: ${RECORDING_DIR:-/app/data/recordings}
            EXPORT_DIR: ${EXPORT_DIR:-/app/data/exports}
        depends_on:
            postgres:
                condition: service_healthy
        command: >
            sh -c "
            alembic upgrade head &&
            uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
            "
        healthcheck:
            test: ['CMD-SHELL', 'curl -f http://localhost:8000/health || exit 1']
            interval: 30s
            timeout: 10s
            retries: 3
        restart: unless-stopped
    postgres:
        image: postgres:16-alpine
        container_name: postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-ai_assessment}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_assessment}']
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

volumes:
    postgres_data:
