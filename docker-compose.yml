name: ai-assessment

services:
    frontend:
        build:
            context: ./frontend
            target: production
        container_name: frontend
        volumes:
            - frontend_tmp:/tmp
        ports:
            - '3000:3000'
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://localhost:3000 || exit 1']
            interval: 30s
            timeout: 10s
            retries: 3
        restart: unless-stopped
    backend:
        build:
            context: ./backend
            target: production
        container_name: backend
        ports:
            - '8000:8000'
        env_file: .env
        environment:
            OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
        volumes:
            - platform_data:/app/data
        depends_on:
            postgres:
                condition: service_healthy
            ollama:
                condition: service_started
            stt:
                condition: service_healthy
            ai-detector:
                condition: service_healthy
        command: >
            sh -c "
            alembic upgrade head &&
            uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
            "
        healthcheck:
            test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'')" || exit 1']
            interval: 30s
            timeout: 10s
            retries: 3
        restart: unless-stopped
    ollama:
        image: ollama/ollama:latest
        container_name: ollama
        ports:
            - '11434:11434'
        volumes:
            - ollama_data:/root/.ollama
        command: serve
        deploy:
            resources:
                limits:
                    cpus: '${OLLAMA_CPU_LIMIT:-4.0}'
                    memory: ${OLLAMA_MEMORY_LIMIT:-4G}
                reservations:
                    cpus: '${OLLAMA_CPU_RESERVATION:-1.0}'
                    memory: ${OLLAMA_MEMORY_RESERVATION:-1G}
        restart: unless-stopped
    ollama-init:
        image: ollama/ollama:latest
        container_name: ollama-init
        env_file: .env
        volumes:
            - ollama_data:/root/.ollama
        environment:
            OLLAMA_HOST: ${OLLAMA_BASE_URL:-http://ollama:11434}
            OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
            OLLAMA_MODEL_BACKUP: ${OLLAMA_MODEL_BACKUP:-qwen2.5:3b}
            ASSESSMENT_OLLAMA_MODEL: ${ASSESSMENT_OLLAMA_MODEL:-qwen2.5:7b}
            ASSESSMENT_OLLAMA_MODEL_BACKUP: ${ASSESSMENT_OLLAMA_MODEL_BACKUP:-llama3.1:8b}
            VISION_MODEL: ${VISION_MODEL:-llava:7b}
        depends_on:
            ollama:
                condition: service_started
        entrypoint: ['/bin/sh', '-lc']
        command: >
            "
            set -e;
            echo 'Waiting for Ollama API...';
            until ollama list >/dev/null 2>&1; do sleep 2; done;
            for m in \"${OLLAMA_MODEL}\" \"${OLLAMA_MODEL_BACKUP}\" \"${ASSESSMENT_OLLAMA_MODEL}\" \"${ASSESSMENT_OLLAMA_MODEL_BACKUP}\" \"${VISION_MODEL}\"; do
              [ -z \"$$m\" ] && continue;
              echo \"Pulling $$m\";
              ollama pull \"$$m\" || true;
            done;
            echo 'Models ready';
            "
        restart: 'no'
    stt:
        build:
            context: ./stt
            target: production
        container_name: stt
        volumes:
            - stt_cache:/root/.cache
        environment:
            WHISPER_MODEL: ${WHISPER_MODEL:-base}
            WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-nl}
        healthcheck:
            test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:9000/health'')" || exit 1']
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        restart: unless-stopped
    ai-detector:
        build:
            context: ./ai-detector
            target: production
        container_name: ai-detector
        volumes:
            - ai_detector_cache:/root/.cache
        environment:
            AI_DETECTOR_MODEL: ${AI_DETECTOR_MODEL:-Hello-SimpleAI/chatgpt-detector-roberta}
            AI_DETECTOR_DEVICE: ${AI_DETECTOR_DEVICE:-cpu}
        healthcheck:
            test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:9001/health'')" || exit 1']
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 180s
        restart: unless-stopped
    retention-worker:
        build:
            context: ./backend
            target: production
        container_name: retention-worker
        env_file: .env
        volumes:
            - platform_data:/app/data
        depends_on:
            postgres:
                condition: service_healthy
        command: ['python', '-m', 'app.retention_worker']
        restart: unless-stopped
    postgres:
        image: postgres:16-alpine
        container_name: postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-ai_assessment}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_assessment}']
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

volumes:
    postgres_data:
    platform_data:
    ollama_data:
    frontend_tmp:
    stt_cache:
    ai_detector_cache:
