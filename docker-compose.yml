services:
    frontend:
        build:
            context: ..
            dockerfile: docker/frontend/Dockerfile
        ports:
            - '3000:3000'
        volumes:
            - ../frontend:/app
            - /app/node_modules
        environment:
            - CHOKIDAR_USEPOLLING=true
    backend:
        build: .
        container_name: backend
        ports:
            - '8000:8000'
        env_file:
            - .env
        restart: unless-stopped
