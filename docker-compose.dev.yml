name: ai-assessment-dev

services:
    frontend:
        build:
            context: ./frontend
            target: dev
        container_name: frontend
        ports:
            - '3000:3000'
        volumes:
            - ./frontend:/app
            - /app/node_modules
        environment:
            - CHOKIDAR_USEPOLLING=true
        restart: unless-stopped
    backend:
        build:
            context: ./backend
            target: dev
        container_name: backend
        ports:
            - '8000:8000'
        env_file: .env
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - ./backend:/app
        command: >
            sh -c "
            alembic upgrade head &&
            uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
            "
        restart: unless-stopped
    postgres:
        image: postgres:16-alpine
        container_name: postgres
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-ai_assessment}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_assessment}']
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: pgadmin
        ports:
            - '5050:80'
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped

volumes:
    postgres_data:
