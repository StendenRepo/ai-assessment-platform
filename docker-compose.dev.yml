name: ai-assessment-dev

services:
    frontend:
        build:
            context: ./frontend
            target: dev
        container_name: frontend
        ports:
            - '3000:3000'
        env_file: .env
        volumes:
            - ./frontend:/app
            - /app/node_modules
        environment:
            - PORT=3000
            - CHOKIDAR_USEPOLLING=true
        restart: unless-stopped
    backend:
        build:
            context: ./backend
            target: dev
        container_name: backend
        ports:
            - '8000:8000'
        env_file: .env
        environment:
            OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
        depends_on:
            postgres:
                condition: service_healthy
            ollama:
                condition: service_started
        volumes:
            - ./backend:/app
        command: >
            sh -c "
            alembic upgrade head &&
            uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
            "
        restart: unless-stopped
    ollama:
        image: ollama/ollama:latest
        container_name: ollama
        ports:
            - '11434:11434'
        volumes:
            - ollama_data:/root/.ollama
        command: serve
        restart: unless-stopped
    ollama-init:
        image: ollama/ollama:latest
        container_name: ollama-init
        env_file: .env
        environment:
            OLLAMA_HOST: ${OLLAMA_BASE_URL:-http://ollama:11434}
            OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
            OLLAMA_MODEL_BACKUP: ${OLLAMA_MODEL_BACKUP:-qwen2.5:3b}
        depends_on:
            ollama:
                condition: service_started
        entrypoint: ['/bin/sh', '-lc']
        command: >
            "
            set -e;
            echo 'Waiting for Ollama API...';
            until ollama list >/dev/null 2>&1; do sleep 2; done;
                        echo 'Pulling primary model: ${OLLAMA_MODEL}';
            ollama pull ${OLLAMA_MODEL};
                        if [ "${OLLAMA_MODEL_BACKUP}" != "${OLLAMA_MODEL}" ]; then
                            echo 'Pulling backup model: ${OLLAMA_MODEL_BACKUP}';
                            ollama pull ${OLLAMA_MODEL_BACKUP};
                        fi;
                        echo 'Models ready';
            "
        restart: 'no'
    postgres:
        image: postgres:16-alpine
        container_name: postgres
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-ai_assessment}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_assessment}']
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: pgadmin
        ports:
            - '5050:80'
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped

volumes:
    postgres_data:
    ollama_data:
